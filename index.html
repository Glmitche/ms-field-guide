<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merchant Services BRM — Scenario Trainer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #F8F7F4;
    color: #0F172A;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: #0A2540;
    padding: 28px 32px 24px;
  }
  .header-inner {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 2px;
    color: #94A3B8;
    font-family: sans-serif;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .header-title {
    font-size: 26px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: -0.5px;
  }
  .header-sub {
    font-size: 15px;
    color: #7DD3FC;
    margin-top: 4px;
    font-style: italic;
  }
  .header-badge {
    background: #132F4C;
    border-radius: 10px;
    padding: 10px 16px;
    text-align: right;
  }
  .header-badge-label {
    font-size: 11px;
    color: #94A3B8;
    font-family: sans-serif;
    margin-bottom: 2px;
  }
  .header-badge-text {
    font-size: 12px;
    color: #BAE6FD;
    max-width: 260px;
    line-height: 1.5;
    font-family: sans-serif;
  }

  /* SCENARIO NAV */
  .scenario-nav {
    background: #0F3460;
    border-bottom: 1px solid #1E4976;
    overflow-x: auto;
  }
  .scenario-nav-inner {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    gap: 2px;
  }
  .nav-btn {
    padding: 12px 16px;
    background: transparent;
    color: #94A3B8;
    border: none;
    border-top: 3px solid transparent;
    cursor: pointer;
    font-size: 12px;
    font-family: sans-serif;
    font-weight: 400;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .nav-btn:hover { color: #FFFFFF; }
  .nav-btn.active {
    background: #FFFFFF;
    color: #0A2540;
    border-top-color: #2563EB;
    font-weight: 600;
  }

  /* MAIN */
  .main {
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 32px;
  }

  /* SCENARIO CARD */
  .scenario-card {
    background: #FFFFFF;
    border-radius: 14px;
    border: 1px solid #E2E8F0;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .sc-header {
    padding: 20px 24px;
    border-bottom: 1px solid #F1F5F9;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .sc-icon { font-size: 32px; flex-shrink: 0; }
  .sc-meta { flex: 1; }
  .sc-title {
    font-size: 20px;
    font-weight: 700;
    color: #0F172A;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }
  .sc-subtitle { font-size: 13px; color: #64748B; font-family: sans-serif; }

  .complexity-label { font-size: 10px; color: #94A3B8; font-family: sans-serif; letter-spacing: 1px; text-transform: uppercase; }
  .complexity-pips { display: flex; gap: 3px; }
  .pip { width: 20px; height: 6px; border-radius: 3px; background: #E2E8F0; }
  .pip.filled { background: #2563EB; }

  .sc-quote {
    padding: 16px 24px;
    background: #F8FAFC;
    border-bottom: 1px solid #F1F5F9;
  }
  .sc-quote-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #94A3B8;
    font-family: sans-serif;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .sc-quote-text {
    font-size: 15px;
    color: #1E3A5F;
    font-style: italic;
    border-left: 3px solid #2563EB;
    padding-left: 14px;
    line-height: 1.6;
    font-family: sans-serif;
  }

  .sc-problem { padding: 16px 24px; }
  .sc-problem-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #94A3B8;
    font-family: sans-serif;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .sc-problem-text {
    font-size: 14px;
    color: #374151;
    line-height: 1.7;
    font-family: sans-serif;
  }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: 1px solid #E2E8F0;
    background: #FFFFFF;
    color: #64748B;
    font-size: 13px;
    font-family: sans-serif;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:hover { background: #F8FAFC; }
  .tab-btn.active {
    border: 1.5px solid #2563EB;
    background: #EFF6FF;
    color: #1D4ED8;
    font-weight: 600;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 12px; }

  /* STEPS */
  .step-item {
    background: #FFFFFF;
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    padding: 16px 20px;
    display: flex;
    gap: 14px;
  }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #EFF6FF;
    color: #1D4ED8;
    font-size: 13px;
    font-weight: 700;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step-content { flex: 1; }
  .step-title { font-size: 14px; font-weight: 600; color: #0F172A; margin-bottom: 4px; font-family: sans-serif; }
  .step-desc { font-size: 13px; color: #475569; line-height: 1.65; font-family: sans-serif; margin-bottom: 10px; }
  .step-terms { display: flex; flex-wrap: wrap; gap: 5px; }
  .term-pill {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    font-family: sans-serif;
    font-weight: 500;
  }
  .term-0 { background: #EDE9FE; color: #4C1D95; border: 1px solid #C4B5FD; }
  .term-1 { background: #FEF3C7; color: #78350F; border: 1px solid #FCD34D; }
  .term-2 { background: #D1FAE5; color: #064E3B; border: 1px solid #6EE7B7; }
  .term-3 { background: #FEE2E2; color: #7F1D1D; border: 1px solid #FCA5A5; }

  /* INTERVIEW LANGUAGE */
  .phrase-card {
    background: #F0FDF4;
    border: 1px solid #86EFAC;
    border-radius: 12px;
    padding: 16px 20px;
  }
  .phrase-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #166534;
    font-family: sans-serif;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .phrase-text {
    font-size: 14px;
    color: #14532D;
    line-height: 1.7;
    font-family: sans-serif;
    font-style: italic;
  }

  .vp-bridge {
    background: #EFF6FF;
    border: 1px solid #BFDBFE;
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    gap: 12px;
  }
  .vp-bridge-icon { font-size: 20px; flex-shrink: 0; }
  .vp-bridge-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #1D4ED8;
    font-family: sans-serif;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .vp-bridge-text {
    font-size: 13px;
    color: #1E40AF;
    line-height: 1.7;
    font-family: sans-serif;
  }

  /* TRAPS */
  .trap-card {
    background: #FFF7ED;
    border: 1px solid #FED7AA;
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    gap: 12px;
  }
  .trap-icon { font-size: 20px; flex-shrink: 0; }
  .trap-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #9A3412;
    font-family: sans-serif;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .trap-text { font-size: 13px; color: #7C2D12; line-height: 1.65; font-family: sans-serif; }

  .reframe-card {
    background: #FFF1F2;
    border: 1px solid #FECDD3;
    border-radius: 12px;
    padding: 18px 20px;
  }
  .reframe-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #9F1239;
    font-family: sans-serif;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .reframe-weak {
    background: #FFE4E6;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .reframe-weak-label { font-size: 11px; color: #9F1239; font-family: sans-serif; font-weight: 600; margin-bottom: 4px; }
  .reframe-weak-text { font-size: 13px; color: #881337; font-family: sans-serif; font-style: italic; }
  .reframe-strong {
    background: #D1FAE5;
    border-radius: 8px;
    padding: 10px 14px;
  }
  .reframe-strong-label { font-size: 11px; color: #065F46; font-family: sans-serif; font-weight: 600; margin-bottom: 4px; }
  .reframe-strong-text { font-size: 13px; color: #064E3B; font-family: sans-serif; font-style: italic; }

  /* FOOTER NAV */
  .footer-nav {
    margin-top: 28px;
    padding: 16px 0;
    border-top: 1px solid #E2E8F0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-count { font-size: 12px; color: #94A3B8; font-family: sans-serif; }
  .footer-btns { display: flex; gap: 8px; }
  .footer-btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid #E2E8F0;
    background: #FFFFFF;
    color: #374151;
    font-size: 13px;
    font-family: sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .footer-btn:hover { background: #F1F5F9; }
  .footer-btn.primary { background: #0A2540; color: #FFFFFF; border-color: #0A2540; }
  .footer-btn.primary:hover { background: #0F3460; }
  .footer-btn:disabled { opacity: 0.35; cursor: default; }

  @media (max-width: 600px) {
    .header, .main { padding: 20px 16px; }
    .scenario-nav-inner { padding: 0 16px; }
    .sc-header { flex-direction: column; }
    .complexity-wrap { align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-eyebrow">JPMorgan Chase · Interview Prep</div>
      <div class="header-title">Merchant Services BRM</div>
      <div class="header-sub">Scenario Field Simulator</div>
    </div>
    <div class="header-badge">
      <div class="header-badge-label">Value Proposition</div>
      <div class="header-badge-text">Consultative · Systems-oriented · Cross-functional leader</div>
    </div>
  </div>
</div>

<!-- SCENARIO NAV -->
<div class="scenario-nav">
  <div class="scenario-nav-inner" id="nav"></div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- Scenario Card -->
  <div class="scenario-card">
    <div class="sc-header">
      <div class="sc-icon" id="sc-icon"></div>
      <div class="sc-meta">
        <div class="sc-title" id="sc-title"></div>
        <div class="sc-subtitle" id="sc-subtitle"></div>
      </div>
      <div class="complexity-wrap">
        <div class="complexity-label">Complexity</div>
        <div class="complexity-pips" id="complexity-pips"></div>
      </div>
    </div>
    <div class="sc-quote">
      <div class="sc-quote-label">Client says</div>
      <div class="sc-quote-text" id="sc-quote"></div>
    </div>
    <div class="sc-problem">
      <div class="sc-problem-label">What's actually going on</div>
      <div class="sc-problem-text" id="sc-problem"></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('steps')">Your Move Sequence</button>
    <button class="tab-btn" onclick="switchTab('language')">Interview Language</button>
    <button class="tab-btn" onclick="switchTab('traps')">Traps &amp; Reframes</button>
  </div>

  <div class="tab-panel active" id="tab-steps"></div>
  <div class="tab-panel" id="tab-language"></div>
  <div class="tab-panel" id="tab-traps"></div>

  <!-- Footer Nav -->
  <div class="footer-nav">
    <div class="footer-count" id="footer-count"></div>
    <div class="footer-btns">
      <button class="footer-btn" id="btn-prev" onclick="navigate(-1)">← Previous</button>
      <button class="footer-btn primary" id="btn-next" onclick="navigate(1)">Next →</button>
    </div>
  </div>

</div>

<script>
const scenarios = [
  {
    title: "Cart Abandonment & Low Digital Conversion",
    client: "Regional retail chain",
    industry: "Retail / E-commerce",
    icon: "🛒",
    complexity: 3,
    clientQuote: "Our web traffic is strong but checkout is broken. Is it a payments problem?",
    realProblem: "They don't know where in the funnel friction lives. It could be payment failure rates, poor mobile UX, 3DS friction, or checkout design — not necessarily the payment rails themselves.",
    steps: [
      { title: "Diagnose before prescribing", desc: "Request authorization rate data, decline reason codes, cart abandonment by device, and payment method mix. You need to know where in the funnel customers are dropping.", terms: ["authorization rate", "decline codes", "soft decline vs hard decline", "payment method mix"] },
      { title: "Map the checkout journey", desc: "Review mobile vs desktop conversion split. Assess 3D Secure (3DS2) friction — authentication challenges add drop-off. Check if guest checkout is available.", terms: ["3DS2", "authentication challenge rate", "frictionless flow", "PCI DSS scope"] },
      { title: "Analyze payment method gaps", desc: "Determine if digital wallet options (Apple Pay, Google Pay) are enabled. Wallet payments reduce checkout fields from ~12 to 1 tap — major conversion lift for mobile.", terms: ["digital wallets", "one-click checkout", "tokenization", "card-on-file"] },
      { title: "Coordinate solution delivery", desc: "Align with Chase's integration team, the client's dev team, and your risk partners. Frame recommendations around revenue impact, not features.", terms: ["payment gateway", "API integration", "sandbox testing", "revenue impact modeling"] },
      { title: "Establish success metrics", desc: "Set baseline authorization rate and conversion rate. Define 90-day targets. Schedule a review checkpoint to demonstrate ROI.", terms: ["authorization rate improvement", "conversion lift", "basis points", "QBR"] }
    ],
    interviewPhrases: [
      { label: "Opening move", text: "Before recommending anything, I'd want to see the authorization rate data and decline reason code breakdown. That tells us whether this is a payment issue or a checkout experience issue — they look the same on the surface but require completely different solutions." },
      { label: "Value framing", text: "My role isn't to push products — it's to help this client understand where revenue is leaking and coordinate the right solution. Even a 2% lift in authorization rate on a $10M annual volume is meaningful." }
    ],
    traps: [{ label: "Don't do this", text: "Immediately recommend adding more payment methods before seeing the data. Clients can tell when you're selling rather than solving." }],
    reframe: { wrong: "We offer digital wallets which can help with checkout.", better: "Based on your mobile traffic share, enabling Apple Pay and Google Pay alone typically drives 15–25% lift in mobile conversion — but let me confirm that hypothesis with your current data first." },
    vpBridge: "Your journey mapping and analytics background is the differentiator here. Most BRMs wait for a client to complain. You'd proactively surface authorization rate trends in quarterly reviews and flag deterioration before the client notices."
  },
  {
    title: "Rising Chargebacks & Dispute Escalation",
    client: "Multi-location restaurant group",
    industry: "Food & Beverage / Hospitality",
    icon: "🧾",
    complexity: 4,
    clientQuote: "Our chargebacks are out of control and we're losing money. The bank isn't protecting us.",
    realProblem: "Chargebacks typically stem from operational gaps — unclear descriptors, delivery app disputes, staff refund process failures, or authorization holds — not from the bank failing to protect them.",
    steps: [
      { title: "De-escalate and actively listen", desc: "Validate the frustration without being defensive. Gather specifics: chargeback rate, dispute categories (fraud vs. service disputes), and which locations are affected.", terms: ["chargeback ratio", "dispute category codes", "Reason Code 4853", "Reason Code 10.4"] },
      { title: "Run a chargeback root cause analysis", desc: "Pull dispute data segmented by reason code, location, and channel. 'Merchandise not received' and 'service not as described' are operational — not fraud.", terms: ["reason codes", "friendly fraud", "first-party misuse", "retrieval request"] },
      { title: "Assess authorization and settlement workflow", desc: "Check for pre-authorization practices, tip adjustment processes, and whether card-not-present (CNP) transactions are handled securely. Delivery platforms create CNP exposure.", terms: ["pre-authorization", "tip adjustment", "card-not-present (CNP)", "AVS", "CVV mismatch"] },
      { title: "Review descriptor and receipt practices", desc: "Unclear billing descriptors drive consumer confusion chargebacks. Ensure receipts capture customer acknowledgment for high-value transactions.", terms: ["billing descriptor", "soft descriptor", "acquirer", "representment"] },
      { title: "Build a dispute management process", desc: "Introduce chargeback representment for winnable disputes. Set a 1% chargeback ratio monitoring threshold. Train staff on refund-first protocols.", terms: ["chargeback representment", "1% chargeback ratio threshold", "excessive chargeback program", "refund-first protocol"] }
    ],
    interviewPhrases: [
      { label: "De-escalation opener", text: "The first thing I'd do is just listen — understand the full picture from their perspective, validate that it's a real business problem, and then shift into diagnostic mode. Jumping straight to solutions before you understand the root cause usually makes things worse." },
      { label: "Expertise signal", text: "I'd want to look at the dispute data segmented by reason code and channel. 'Chargebacks are rising' tells us very little — the reason codes tell us whether this is fraud exposure, operational process gaps, or delivery platform CNP risk. Each one has a different fix." }
    ],
    traps: [{ label: "Don't do this", text: "Get defensive about Chase's processes or blame the client immediately. You're on their side — your job is to be their internal advocate and fix the problem." }],
    reframe: { wrong: "Chargebacks are part of doing business. Here's our dispute process.", better: "Your chargeback ratio is approaching a threshold that triggers additional scrutiny from the card networks. Let's fix the underlying causes now so you don't face additional fees or program enrollment down the road." },
    vpBridge: "Your student affairs and operational leadership background is directly applicable. You've managed escalations where emotions are high and the facts are messy. That composure — listening first, diagnosing second, solving third — is exactly the pattern that retains clients in these moments."
  },
  {
    title: "Scaling Payment Operations Across New Locations",
    client: "Fast-growing franchise or multi-unit business",
    industry: "Franchise / Multi-unit Retail",
    icon: "🏪",
    complexity: 4,
    clientQuote: "We're opening 12 new locations this year. Our current payment setup won't scale and reporting is a mess.",
    realProblem: "They need an integrated payment infrastructure, not just more terminals. The real pain is reconciliation complexity, inconsistent reporting across locations, and lack of a single operational view.",
    steps: [
      { title: "Understand current state completely", desc: "Map how they currently process payments across locations. What POS systems are in use? How do they reconcile? What does the reporting gap cost them in time?", terms: ["POS integration", "payment gateway", "reconciliation", "settlement reporting"] },
      { title: "Identify integration architecture needs", desc: "Assess whether they need a unified payment gateway, a multi-location reporting dashboard, or a full POS migration. Enterprise clients often need omnichannel capability.", terms: ["omnichannel payments", "unified commerce", "gateway integration", "ERP integration"] },
      { title: "Design for operational consistency", desc: "Recommend standardized hardware, software, and onboarding processes across all locations. Inconsistent setups create reconciliation nightmares and security exposure.", terms: ["hardware deployment", "P2PE (point-to-point encryption)", "tokenization", "PCI scope reduction"] },
      { title: "Build a phased implementation roadmap", desc: "Sequence the rollout by risk and complexity. Pilot with 2–3 locations, validate reporting and reconciliation outputs, then scale. Protect their operations during transition.", terms: ["phased implementation", "parallel processing", "cutover plan", "go-live support"] },
      { title: "Create ongoing governance and review", desc: "Establish monthly reporting reviews and quarterly business reviews (QBRs). Position yourself as the single point of accountability for their payment operations health.", terms: ["QBR (quarterly business review)", "portfolio management", "interchange optimization", "volume incentives"] }
    ],
    interviewPhrases: [
      { label: "Discovery framing", text: "Before talking about solutions, I'd want to understand how their current reconciliation process works and where it breaks down. Scaling a broken process just creates bigger problems faster." },
      { label: "Strategic positioning", text: "My goal here would be to position JPMorgan Chase as their long-term operational partner for payments — not just the company that processed their card transactions. That means proactively identifying what they'll need at 50 locations, not just solving for today's 20." }
    ],
    traps: [{ label: "Don't do this", text: "Lead with hardware and terminal counts. That turns this into a commodity conversation. The real value is in the operational infrastructure, reporting visibility, and integration work." }],
    reframe: { wrong: "We can deploy terminals to all your new locations quickly.", better: "Let's design a payment infrastructure that scales with you — unified reporting, consistent security standards, and an integration that connects to your existing systems — so your operations team isn't drowning in manual reconciliation by location 30." },
    vpBridge: "You've built scalable operational systems before. At SNHU and Reflekt Me, you weren't just launching programs — you were designing infrastructure that could grow without breaking. That lens translates directly to how you'd approach a multi-unit payment buildout."
  },
  {
    title: "Manual Payment Operations & Inefficiency",
    client: "Mid-size B2B services company",
    industry: "Professional Services / B2B",
    icon: "📂",
    complexity: 3,
    clientQuote: "We spend hours every week manually matching invoices to payments and chasing receivables. There has to be a better way.",
    realProblem: "They're operating without automation between their payment acceptance and their accounting/ERP system. This is an accounts receivable and workflow integration problem — solvable, and high-value to fix.",
    steps: [
      { title: "Map the current AR workflow", desc: "Understand the full receivables cycle: how invoices are created, sent, paid, matched, and reconciled. Identify where humans are substituting for automation.", terms: ["accounts receivable (AR)", "invoice reconciliation", "remittance matching", "DSO (days sales outstanding)"] },
      { title: "Identify the integration gap", desc: "Is their payment acceptance system disconnected from their accounting software (QuickBooks, NetSuite, SAP)? The fix is often an integrated payment platform or an API connection.", terms: ["ERP integration", "QuickBooks/NetSuite connector", "ACH payments", "virtual card acceptance"] },
      { title: "Assess payment method mix for B2B", desc: "B2B clients often still rely on checks and ACH. Propose electronic payment options — virtual cards, ACH+, or integrated AP/AR solutions — that reduce manual handling.", terms: ["ACH", "virtual card (vCard)", "straight-through processing (STP)", "Level 2/Level 3 data"] },
      { title: "Recommend automation and reporting tools", desc: "Introduce automated invoice matching, recurring billing if applicable, and a reporting dashboard that gives their finance team real-time AR visibility.", terms: ["automated reconciliation", "recurring billing", "payment reporting dashboard", "remittance advice"] },
      { title: "Quantify the ROI", desc: "Calculate time saved per week × FTE cost. If they're spending 5 hours/week at $40/hr, that's $10K/year in recoverable capacity — plus faster cash flow from reduced DSO.", terms: ["ROI modeling", "DSO reduction", "working capital", "cash flow acceleration"] }
    ],
    interviewPhrases: [
      { label: "Problem reframe", text: "What they're describing isn't really a payments problem — it's a workflow automation problem that happens to sit at the intersection of payments and accounting. My job is to connect those two worlds." },
      { label: "ROI anchor", text: "I'd want to quantify what they're losing. If their team is spending 8 hours a week on manual reconciliation, that's over $20K a year in labor cost — and that's before factoring in the revenue impact of slower collections." }
    ],
    traps: [{ label: "Don't do this", text: "Recommend products without quantifying the problem first. If you can't show them the cost of their current state, you can't make the case for change." }],
    reframe: { wrong: "We have integrated payment solutions that automate reconciliation.", better: "Based on what you described, I'd want to calculate your current DSO and weekly AR labor hours before we talk solutions. Once we know the cost of the problem, we can build the right case for automation — and I can show you exactly what ROI you'd expect." },
    vpBridge: "Your product management background gives you a powerful lens here. You know how to map a user journey, find the friction, and design the fix. In merchant services, that same skill set surfaces solutions clients didn't know they needed — which is what makes a BRM indispensable rather than replaceable."
  },
  {
    title: "At-Risk Client Relationship",
    client: "Long-term established account",
    industry: "Any industry — retention scenario",
    icon: "⚠️",
    complexity: 5,
    clientQuote: "We've had too many issues since implementation. We're starting to look at other options.",
    realProblem: "Trust has eroded. The client feels unseen and unsupported. The solution isn't technical — it's relational. But you also need to demonstrate operational follow-through or the relationship will not recover.",
    steps: [
      { title: "Request an urgent in-person or video meeting", desc: "Don't manage this by email or phone. Show up. Physical presence signals that you take the relationship seriously. Ask to hear everything — don't defend until you've fully listened.", terms: ["executive escalation", "relationship recovery meeting", "client health score"] },
      { title: "Conduct a structured issues audit", desc: "Catalog every open issue, complaint, and unresolved commitment. Put it in writing and share it with the client. Transparency about what went wrong is the first step to rebuilding credibility.", terms: ["implementation review", "issue log", "SLA breach", "root cause analysis"] },
      { title: "Create a written recovery plan with owners and timelines", desc: "Assign named internal owners to each open item. Give the client a timeline for resolution. Follow up before the deadline, not after.", terms: ["corrective action plan", "escalation path", "executive sponsor", "30-60-90 plan"] },
      { title: "Neutralize the competitive threat", desc: "Understand who they're evaluating. Position switching costs honestly — migration risk, integration rebuild time, data continuity — without being manipulative. Show what staying and resolving looks like.", terms: ["competitive displacement risk", "switching cost analysis", "retention incentive", "contract renewal"] },
      { title: "Shift to strategic account mode post-recovery", desc: "Once trust is rebuilt, reposition the relationship around strategic planning — QBRs, roadmap conversations, growth planning. Move from firefighting to partnership.", terms: ["QBR", "strategic account plan", "wallet share", "cross-sell opportunity", "net revenue retention"] }
    ],
    interviewPhrases: [
      { label: "Leadership signal", text: "My first call would be to get in front of them — not to explain ourselves, but to listen completely. A client that's threatening to leave is a client who still wants to be heard. My job at that point is to show up and earn the right to fix it." },
      { label: "Accountability framing", text: "I'd put together a written recovery plan with named owners and dates — not because it's policy, but because that's what restores credibility. Promises are cheap. A written plan with follow-through is the differentiator." }
    ],
    traps: [{ label: "Don't do this", text: "Offer discounts or incentives before resolving the underlying issues. Clients can tell when you're trying to buy their silence rather than earn back their trust. Discounts without operational improvements just delay the departure." }],
    reframe: { wrong: "We can offer you a rate adjustment to smooth things over.", better: "Before we talk about any commercial changes, I want to make sure we've earned your confidence back operationally. Let me show you the recovery plan, close out every open item, and then we can have the commercial conversation from a position of trust." },
    vpBridge: "This scenario is where your student affairs and institutional leadership experience shines hardest. You've navigated difficult stakeholder situations where the emotional temperature was high and the facts were contested. The composure, the structure, and the follow-through you bring to those situations is genuinely rare in sales environments."
  },
  {
    title: "New Client Onboarding & Competitive Win",
    client: "Newly acquired merchant switching from Fiserv or Square",
    industry: "Any — new business scenario",
    icon: "✅",
    complexity: 3,
    clientQuote: "We decided to go with Chase. We need to make sure this transition is smooth — our last switch was a disaster.",
    realProblem: "First impressions after the sale determine whether this client stays long-term. A flawed onboarding creates the exact conditions for a future at-risk relationship. Your job is to build trust through operational excellence from day one.",
    steps: [
      { title: "Set a structured onboarding plan immediately", desc: "Within 48 hours of close, send a written onboarding plan with key milestones, stakeholder contacts, and your direct contact. Clients who just switched need certainty.", terms: ["merchant onboarding", "MID (Merchant ID)", "boarding timeline", "go-live date"] },
      { title: "Capture full operational requirements", desc: "Conduct a discovery call with their operations team — not just the decision-maker. Understand POS setup, employee roles, reporting needs, and any integration requirements before anything is configured.", terms: ["operational requirements", "POS deployment", "gateway configuration", "user permissions"] },
      { title: "Manage the data migration carefully", desc: "If they have card-on-file data from a previous processor, coordinate a compliant token migration. Loss of stored payment data is a serious operational disruption for subscription or recurring businesses.", terms: ["token migration", "network tokenization", "card-on-file", "PCI-compliant data transfer"] },
      { title: "Train their team — not just their IT", desc: "Schedule a 60-minute training session with the front-line staff who will actually operate the terminals and handle disputes. Documentation alone doesn't stick.", terms: ["terminal training", "dispute workflow training", "user adoption", "chargeback prevention"] },
      { title: "Conduct a 30-day health check", desc: "At day 30, review authorization rates, any declined transaction patterns, dispute volume, and team satisfaction. Surface any friction before it becomes a complaint.", terms: ["30-day review", "authorization rate baseline", "client health check", "early-warning indicators"] }
    ],

      { label: "Competitive awareness", text: "When a client is coming from Fiserv or Square, they've experienced a different model. I want to show them within the first 30 days that Chase's approach is categorically different — and that starts with how I show up personally in the onboarding process." }
    ],

    reframe: { wrong: "Our implementation team will reach out to set things up.", better: "I'll be personally involved throughout your onboarding. Here's the plan I've put together — milestones, contacts, and a 30-day review already scheduled. You'll never wonder where things stand." },
    vpBridge: "Your experience designing onboarding systems and student success frameworks is directly applicable. You know that the first 30–60 days of any new relationship set the behavioral patterns for everything that follows. Applying that lens to merchant onboarding puts you ahead of 90% of BRMs who treat it as a handoff, not a launch."
  }
];

let activeIdx = 0;
let activeTab = "steps";

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = scenarios.map((s, i) => `
    <button class="nav-btn ${i === activeIdx ? "active" : ""}" onclick="selectScenario(${i})">
      ${s.icon} ${i + 1}. ${s.industry.split("/")[0].trim()}
    </button>
  `).join("");
}

function renderScenarioCard() {
  const s = scenarios[activeIdx];
  document.getElementById("sc-icon").textContent = s.icon;
  document.getElementById("sc-title").textContent = s.title;
  document.getElementById("sc-subtitle").textContent = `${s.client} · ${s.industry}`;
  document.getElementById("sc-quote").textContent = `"${s.clientQuote}"`;
  document.getElementById("sc-problem").textContent = s.realProblem;

  const pips = document.getElementById("complexity-pips");
  pips.innerHTML = [1,2,3,4,5].map(n =>
    `<div class="pip ${n <= s.complexity ? "filled" : ""}"></div>`
  ).join("");

  document.getElementById("footer-count").textContent = `Scenario ${activeIdx + 1} of ${scenarios.length}`;
  document.getElementById("btn-prev").disabled = activeIdx === 0;
  document.getElementById("btn-next").disabled = activeIdx === scenarios.length - 1;
}

function renderSteps() {
  const s = scenarios[activeIdx];
  document.getElementById("tab-steps").innerHTML = s.steps.map((step, i) => `
    <div class="step-item">
      <div class="step-num">${i + 1}</div>
      <div class="step-content">
        <div class="step-title">${step.title}</div>
        <div class="step-desc">${step.desc}</div>
        <div class="step-terms">
          ${step.terms.map((t, ti) => `<span class="term-pill term-${ti % 4}">${t}</span>`).join("")}
        </div>
      </div>
    </div>
  `).join("");
}

function renderLanguage() {
  const s = scenarios[activeIdx];
  document.getElementById("tab-language").innerHTML =
    s.interviewPhrases.map(p => `
      <div class="phrase-card">
        <div class="phrase-label">${p.label}</div>
        <div class="phrase-text">"${p.text}"</div>
      </div>
    `).join("") +
    `<div class="vp-bridge">
      <div class="vp-bridge-icon">🔗</div>
      <div>
        <div class="vp-bridge-label">Your value proposition bridge</div>
        <div class="vp-bridge-text">${s.vpBridge}</div>
      </div>
    </div>`;
}

function renderTraps() {
  const s = scenarios[activeIdx];
  document.getElementById("tab-traps").innerHTML =
    s.traps.map(t => `
      <div class="trap-card">
        <div class="trap-icon">⚡</div>
        <div>
          <div class="trap-label">${t.label}</div>
          <div class="trap-text">${t.text}</div>
        </div>
      </div>
    `).join("") +
    `<div class="reframe-card">
      <div class="reframe-label">Reframe this language</div>
      <div class="reframe-weak">
        <div class="reframe-weak-label">❌ Weak</div>
        <div class="reframe-weak-text">"${s.reframe.wrong}"</div>
      </div>
      <div class="reframe-strong">
        <div class="reframe-strong-label">✓ Strong</div>
        <div class="reframe-strong-text">"${s.reframe.better}"</div>
      </div>
    </div>`;
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach((btn, i) => {
    const tabs = ["steps", "language", "traps"];
    btn.classList.toggle("active", tabs[i] === tab);
  });
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
}

function selectScenario(i) {
  activeIdx = i;
  activeTab = "steps";
  renderNav();
  renderScenarioCard();
  renderSteps();
  renderLanguage();
  renderTraps();
  switchTab("steps");
}

function navigate(dir) {
  const next = activeIdx + dir;
  if (next >= 0 && next < scenarios.length) selectScenario(next);
}

// Init
selectScenario(0);
</script>
